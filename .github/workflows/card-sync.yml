name: Card Sync

# Opens a pull request that replaces the bundled MOS NAS Card with the asset of
# the newest anym001/ha-mos-card release. The card is built and released there;
# this repository only ships the file (see bundled_card.py).
#
# A pull request opened with github.token starts no workflows, so its required
# checks never report. Set CARD_SYNC_TOKEN (a fine-grained token with contents
# and pull-requests write on this repository) to have CI run on it.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  card-sync:
    name: Sync the bundled card
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the card-sync/<tag> branch
      pull-requests: write # opens the sync pull request
    env:
      GH_TOKEN: ${{ secrets.CARD_SYNC_TOKEN || github.token }}
      CARD_REPO: anym001/ha-mos-card
      BUNDLE: custom_components/mos/www/mos-card.js
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the newest card release
        id: release
        run: |
          TAG=$(gh release view --repo "$CARD_REPO" --json tagName --jq .tagName)
          gh release download "$TAG" --repo "$CARD_REPO" --pattern mos-card.js --dir "$RUNNER_TEMP"
          # release-please lists features under this heading; anything else ships as a fix.
          if gh release view "$TAG" --repo "$CARD_REPO" --json body --jq .body | grep -q '^### Features'; then
            TYPE=feat
          else
            TYPE=fix
          fi
          {
            echo "tag=$TAG"
            echo "type=$TYPE"
            echo "branch=card-sync/$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Compare with the bundled card
        id: compare
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          if cmp -s "$RUNNER_TEMP/mos-card.js" "$BUNDLE"; then
            echo "The bundled card already matches the newest release."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "$BRANCH already exists; its pull request is still open or was declined."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the sync pull request
        if: steps.compare.outputs.needed == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TYPE: ${{ steps.release.outputs.type }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          cp "$RUNNER_TEMP/mos-card.js" "$BUNDLE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "$BUNDLE"
          git commit \
            -m "$TYPE(card): bundle the mos nas card $TAG" \
            -m "- Replace the bundled card with the $TAG release asset of $CARD_REPO" \
            -m "Release notes: https://github.com/$CARD_REPO/releases/tag/$TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TYPE(card): bundle the mos nas card $TAG" \
            --body "Replaces \`$BUNDLE\` with the \`mos-card.js\` asset of [$CARD_REPO $TAG](https://github.com/$CARD_REPO/releases/tag/$TAG). The bundle is minified; review the change in the card repository."
