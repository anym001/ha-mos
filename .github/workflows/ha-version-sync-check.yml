name: HA Version Sync Check

on:
  # Deliberately unfiltered: as a required check this has to report on every
  # pull request. A paths filter makes it silently not run for a PR that
  # touches none of them, and GitHub then waits forever for a status that will
  # never arrive - the PR stays unmergeable with nothing failing. The job is a
  # checkout plus one script, a few seconds.
  pull_request:
  push:
    branches:
      - main
    paths:
      - hacs.json
      - requirements_test.txt
      - .devcontainer/.env
      - .github/workflows/*.yml
      - script/ha-version-sync
      - script/setup/bootstrap

permissions: {}

jobs:
  check-ha-version-sync:
    name: Ensure HA version sources are in sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate HA version sync
        run: ./script/ha-version-sync
