# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Monthly on purpose: this is a solo project and weekly updates produce more
# review churn than they are worth. The monthly cadence also lets fresh
# releases settle on its own, which is why no cooldown windows are configured.
#
# This file is listed in .templatesyncignore — the blueprint's own schedule
# must not overwrite this decision again (it did once, in #21).
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Bundle all minor/patch action updates into a single PR; major updates stay separate
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # homeassistant is a transitive dependency pulled in by pytest-homeassistant-custom-component.
      # Its version must stay in sync with the "homeassistant" key in hacs.json — update that manually
      # when bumping pytest-homeassistant-custom-component manually.
      - dependency-name: "homeassistant"
      # pytest-homeassistant-custom-component releases track Home Assistant closely.
      # Keep this pinned and bump it manually together with hacs.json "homeassistant".
      - dependency-name: "pytest-homeassistant-custom-component"
    groups:
      # Bundle all minor/patch Python dep updates into a single PR; major updates stay separate.
      # pytest-homeassistant-custom-component is intentionally excluded and ignored above,
      # because it is updated manually together with hacs.json "homeassistant".
      python-dependencies:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "pytest-homeassistant-custom-component"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Bundle all minor/patch Node tooling updates into a single PR. Major updates
      # stay separate on purpose: they tend to raise the minimum Node version
      # (commitlint 21 and markdownlint-cli2 already require Node >= 22 / >= 20),
      # which needs a deliberate look at the devcontainer rather than an auto-merge.
      node-dependencies:
        applies-to: version-updates
        update-types:
          - minor
          - patch
