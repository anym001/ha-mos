# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
    # PRs always target dev, never main (branching convention, see
    # CONTRIBUTING.md); main only updates via the dev -> main release PR.
    target-branch: "dev"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Bundle every github-actions update (incl. majors) into a single monthly
      # PR instead of one PR per action. Avoids the mutual merge conflicts that
      # separate PRs cause once the first one lands (each touches the same
      # pinned-SHA lines across lint.yml/validate.yml/copilot-setup-steps.yml).
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # homeassistant is a transitive dependency pulled in by pytest-homeassistant-custom-component.
      # Its version must stay in sync with the "homeassistant" key in hacs.json — update that manually
      # when bumping pytest-homeassistant-custom-component manually.
      - dependency-name: "homeassistant"
      # pytest-homeassistant-custom-component releases track Home Assistant closely.
      # Keep this pinned and bump it manually together with hacs.json "homeassistant".
      - dependency-name: "pytest-homeassistant-custom-component"
    groups:
      # Bundle all minor/patch Python dep updates into a single PR; major updates
      # stay separate so a breaking bump (e.g. a web framework) is reviewed in isolation.
      # pytest-homeassistant-custom-component is intentionally excluded and ignored above,
      # because it is updated manually together with hacs.json "homeassistant".
      python-dependencies:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "pytest-homeassistant-custom-component"
